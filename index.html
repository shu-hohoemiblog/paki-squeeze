<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="外はパキパキ、中はぷにぷに。押す・引っぱる・にぎるで遊べるバター型パキパキスクイーズのシミュレーター。">
<meta property="og:type" content="website">
<meta property="og:title" content="パキパキバター">
<meta property="og:description" content="外はパキパキ、中はぷにぷに。スマホで割って遊べるパキパキスクイーズ。">
<meta property="og:url" content="https://shu-hohoemiblog.github.io/paki-squeeze/">
<meta property="og:image" content="https://shu-hohoemiblog.github.io/paki-squeeze/og.png">
<meta name="twitter:card" content="summary_large_image">
<title>パキパキスクイーズ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen toy. Header with パキ率 meter / the squishy on a tabletop stage / candy-glazed paki buttons below. */
:root{
  --bg:#ECEFF5; --ink:#24222E; --sub:#6B6D80; --line:#D2D6E2;
  --stage-top:#F9F7FC; --stage-bot:#E1E5EF; --table:#D3D8E5;
  --btn:#FFFFFF; --btn-ink:#2A2836; --btn-edge:#C2C7D6;
  --btn-on:#2E2B3D; --btn-on-ink:#FFFFFF; --btn-on-edge:#120F1C;
  --accent:#FF5A8C; --accent-edge:#C2305F; --accent-ink:#FFFFFF;
  --sheen:.85; --glaze-a:rgba(255,255,255,.98); --glaze-b:rgba(226,231,243,.95);
  --crack:rgba(72,50,70,.55);
  --f-disp:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14141B; --ink:#F2F0F7; --sub:#9C9DB0; --line:#2B2C38;
  --stage-top:#23232E; --stage-bot:#17171F; --table:#2C2D3A;
  --btn:#2D2D3B; --btn-ink:#F2F0F7; --btn-edge:#0C0C12;
  --btn-on:#F2F0F7; --btn-on-ink:#1C1A26; --btn-on-edge:#8D8BA0;
  --accent:#FF6E9B; --accent-edge:#9E2850; --accent-ink:#FFFFFF;
  --sheen:.35; --glaze-a:rgba(255,255,255,.92); --glaze-b:rgba(200,205,222,.85);
  --crack:rgba(10,8,16,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14141B; --ink:#F2F0F7; --sub:#9C9DB0; --line:#2B2C38;
  --stage-top:#23232E; --stage-bot:#17171F; --table:#2C2D3A;
  --btn:#2D2D3B; --btn-ink:#F2F0F7; --btn-edge:#0C0C12;
  --btn-on:#F2F0F7; --btn-on-ink:#1C1A26; --btn-on-edge:#8D8BA0;
  --accent:#FF6E9B; --accent-edge:#9E2850; --accent-ink:#FFFFFF;
  --sheen:.35; --glaze-a:rgba(255,255,255,.92); --glaze-b:rgba(200,205,222,.85);
  --crack:rgba(10,8,16,.7); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{box-sizing:border-box;height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font:400 clamp(20px,5.6vw,27px)/1.1 var(--f-disp);letter-spacing:.02em;text-wrap:balance}
h1 small{display:block;font:700 11px/1.3 var(--f-ui);color:var(--sub);letter-spacing:.08em;margin-top:3px}
.meter{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.meter .lab{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.08em}
.meter b{font:400 22px/1 var(--f-disp);min-width:2.2em;text-align:right}
.bar{position:relative;width:64px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:inherit;transition:width .25s}
.phase{font-size:11px;font-weight:900;padding:4px 8px;border-radius:99px;background:var(--btn);box-shadow:0 0 0 1px var(--line);white-space:nowrap}
.phase[data-p="2"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}

#stage{position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;
  background:linear-gradient(var(--stage-top),var(--stage-bot));box-shadow:inset 0 0 0 1px var(--line)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);margin:0;max-width:calc(100% - 32px);box-sizing:border-box;
  font-size:12px;font-weight:700;color:var(--sub);background:var(--btn);padding:6px 12px;border-radius:99px;
  box-shadow:0 0 0 1px var(--line);text-align:center;transition:opacity .5s;pointer-events:none}
.hint.hide{opacity:0}

#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;
  padding:0 16px 22%;background:linear-gradient(transparent 30%,color-mix(in srgb,var(--stage-bot) 70%,transparent));transition:opacity .35s}
#start.gone{opacity:0;pointer-events:none}
#start p{margin:0;font-size:12px;font-weight:700;color:var(--sub);text-align:center}

nav{display:flex;flex-direction:column;gap:8px}
.cap{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.08em;margin:0 0 -2px 2px}
.row{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.row.four{grid-template-columns:1.25fr 1.25fr 1fr 1fr}

/* ===== paki buttons: candy-glazed, they crack when pressed ===== */
.paki{position:relative;isolation:isolate;overflow:hidden;border:0;border-radius:14px;min-height:50px;padding:6px 8px;margin:0 0 4px;
  font:700 15px/1.15 var(--f-ui);color:var(--btn-ink);background:var(--btn);cursor:pointer;touch-action:manipulation;
  box-shadow:0 4px 0 var(--btn-edge),0 9px 16px -9px rgba(20,16,40,.45);
  transition:transform .06s ease-out,box-shadow .06s ease-out,background-color .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.paki::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;opacity:var(--sheen);pointer-events:none;
  background:
    radial-gradient(ellipse 40% 26% at 24% 20%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%),
    linear-gradient(170deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.12) 40%,rgba(255,255,255,0) 55%,rgba(255,255,255,.2) 100%)}
.paki::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.6)}
.paki.down{transform:translateY(4px) scale(.985);box-shadow:0 0 0 var(--btn-edge),0 3px 8px -6px rgba(20,16,40,.4)}
.paki[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink);box-shadow:0 4px 0 var(--btn-on-edge),0 9px 16px -9px rgba(20,16,40,.45)}
.paki[aria-pressed="true"].down{box-shadow:0 0 0 var(--btn-on-edge)}
.paki.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-edge),0 9px 16px -9px rgba(150,30,70,.6)}
.paki.primary.down{box-shadow:0 0 0 var(--accent-edge)}
.paki.big{font-size:18px;min-height:58px;padding:8px 30px;border-radius:18px}
.paki:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.paki .k{font-size:10px;font-weight:700;opacity:.65;letter-spacing:.06em}
.paki .v{font-size:12px;font-weight:900;white-space:nowrap}
.paki[disabled]{opacity:.5;cursor:default}
.paki svg.cr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.cr g{transition:opacity .7s ease-in}
.cr g.fade{opacity:0}
.cr path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:crk .12s ease-out forwards}
.cr path.d{stroke:var(--crack);stroke-width:1.4}
.cr path.l{stroke:rgba(255,255,255,.9);stroke-width:.9}
.cr circle{fill:rgba(255,255,255,.85)}
@keyframes crk{to{stroke-dashoffset:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx i{position:absolute;display:block;background:linear-gradient(160deg,var(--glaze-a),var(--glaze-b))}
.hsw{position:fixed;left:-50px;top:0;opacity:0;width:1px;height:1px;pointer-events:none}
@media (max-width:350px){.row.four{grid-template-columns:1fr 1fr}}
.cstat{margin:-4px 0 0 2px;letter-spacing:.02em}
label.paki{box-sizing:border-box;text-align:center}
.row.mode{grid-template-columns:1fr 1fr 1.6fr;align-items:start}
.fing{box-sizing:border-box;min-height:50px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:4px 10px;border-radius:14px;background:var(--btn);box-shadow:0 0 0 1px var(--line);min-width:0}
.fing label{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.06em}
.fing b{font-size:12px;color:var(--ink);font-weight:900;letter-spacing:0;white-space:nowrap}
.fing input{width:100%;margin:0;-webkit-appearance:none;appearance:none;background:transparent;height:28px;touch-action:manipulation;cursor:pointer}
.fing input::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--accent) var(--fill,33%),var(--line) var(--fill,33%))}
.fing input::-moz-range-track{height:8px;border-radius:99px;background:var(--line)}
.fing input::-moz-range-progress{height:8px;border-radius:99px;background:var(--accent)}
.fing input::-webkit-slider-thumb{-webkit-appearance:none;width:var(--th,24px);height:var(--th,24px);margin-top:calc((8px - var(--th,24px))/2);border-radius:50%;border:0;
  background:radial-gradient(circle at 35% 30%,#fff 0 22%,var(--glaze-b) 62%,#c9cddb);box-shadow:0 2px 0 var(--btn-edge),0 4px 8px -3px rgba(20,16,40,.5)}
.fing input::-moz-range-thumb{width:var(--th,24px);height:var(--th,24px);border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff 0 22%,var(--glaze-b) 62%,#c9cddb);box-shadow:0 2px 0 var(--btn-edge)}
.fing input:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){.bar i,.hint,#start{transition:none}.cr path{animation-duration:.01s}}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>パキパキバター<small>外はパキパキ、中はぷにぷに。</small></h1>
    <div class="meter" aria-live="polite">
      <span class="lab">パキ率</span><b id="pct">0</b><span class="lab">%</span>
      <span class="bar"><i id="barFill"></i></span>
      <span class="phase" id="phase" data-p="0">パキパキ期</span>
    </div>
  </header>

  <main id="stage">
    <canvas id="cv" aria-label="バター型のパキパキスクイーズ。押す・なぞる・長押しで表面が割れます"></canvas>
    <p class="hint hide" id="hint">押す・なぞる・長押しでパキパキ。2本指で引っぱる</p>
    <div id="start">
      <button class="paki primary big" id="go" type="button">ケースから出す</button>
      <p>音が出ます。iPhoneはマナーモードを解除してください</p>
    </div>
  </main>

  <nav aria-label="設定">
    <p class="cap">コーティングの厚さ</p>
    <div class="row" role="group" aria-label="コーティングの厚さ">
      <button class="paki" type="button" data-th="thin" aria-pressed="false">うすパリ</button>
      <button class="paki" type="button" data-th="mid" aria-pressed="true">ふつう</button>
      <button class="paki" type="button" data-th="thick" aria-pressed="false">ザクザク</button>
    </div>
    <div class="row mode">
      <button class="paki" type="button" data-mode="press" aria-pressed="true"><span class="k">さわり方</span><span class="v">押す</span></button>
      <button class="paki" type="button" data-mode="pull" aria-pressed="false"><span class="k">さわり方</span><span class="v">引っぱる</span></button>
      <div class="fing"><label for="finger"><span>指の太さ</span><b id="fingv">ふつう</b></label><input type="range" id="finger" min="0.5" max="2" step="0.25" value="1"></div>
    </div>
    <p class="cap">自分の音で試す（1回ずつに自動で切り分け）</p>
    <div class="row">
      <label class="paki" for="fNecho" tabindex="0"><span class="k">音を読み込む</span><span class="v">ねちょ</span></label>
      <label class="paki" for="fPaki" tabindex="0"><span class="k">音を読み込む</span><span class="v">パキパキ</span></label>
      <button class="paki" type="button" id="fReset"><span class="k">読み込んだ音を</span><span class="v">元に戻す</span></button>
    </div>
    <p class="cap cstat" id="cstat" aria-live="polite">ねちょ: 収録音 ／ パキパキ: 合成音</p>
    <input type="file" id="fNecho" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg" multiple hidden>
    <input type="file" id="fPaki" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg" multiple hidden>
    <div class="row four">
      <button class="paki primary" type="button" id="reset">リセット</button>
      <button class="paki" type="button" id="grip"><span class="k">長押しで</span><span class="v">にぎる</span></button>
      <button class="paki" type="button" id="snd" aria-pressed="true"><span class="k">音</span><span class="v" id="sndv">ON</span></button>
      <button class="paki" type="button" id="vib" aria-pressed="true"><span class="k">振動</span><span class="v" id="vibv">ON</span></button>
    </div>
  </nav>
</div>
<div id="fx" aria-hidden="true"></div>
<input type="checkbox" switch id="hsw" class="hsw" tabindex="-1" aria-hidden="true"><label for="hsw" id="hlab" class="hsw" aria-hidden="true"></label>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const expR=m=>-Math.log(1-Math.random())*m;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =========================================================
   SOUND: every sample is synthesized here at 48kHz.
   Cracks = stacks of sub-millisecond filtered noise clicks
   (fracture cascade) + glassy shell resonances + a dull body thump.
   Squish = pressure noise + resonant wet tone + tiny bubble chirps.
   ========================================================= */
const SR=48000;
function mk(d){const n=Math.ceil(d*SR);return{L:new Float32Array(n),R:new Float32Array(n),n,hits:[0]};}
function coef(type,f,Q){
  f=Math.min(f,SR*.45);const w=TAU*f/SR,cs=Math.cos(w),sn=Math.sin(w),al=sn/(2*Q);let b0,b1,b2;
  if(type==='bp'){b0=al;b1=0;b2=-al;}else if(type==='lp'){b0=(1-cs)/2;b1=1-cs;b2=b0;}else{b0=(1+cs)/2;b1=-(1+cs);b2=b0;}
  const a0=1+al;return[b0/a0,b1/a0,b2/a0,-2*cs/a0,(1-al)/a0];
}
function runF(x,c){let x1=0,x2=0,y1=0,y2=0;for(let i=0;i<x.length;i++){const v=x[i];const y=c[0]*v+c[1]*x1+c[2]*x2-c[3]*y1-c[4]*y2;x2=x1;x1=v;y2=y1;y1=y;x[i]=y;}}
function mixIn(b,s0,arr,amp,pan){
  pan=clamp(pan,-1,1);const th=(pan+1)*Math.PI/4,gl=Math.cos(th)*amp*1.414,gr=Math.sin(th)*amp*1.414;
  const itd=Math.round(Math.abs(pan)*22),dL=pan>0?itd:0,dR=pan<0?itd:0;
  for(let i=0;i<arr.length;i++){const v=arr[i];let j=s0+i+dL;if(j<b.n)b.L[j]+=v*gl;j=s0+i+dR;if(j<b.n)b.R[j]+=v*gr;}
}
function click(b,t,o){
  const s0=Math.floor(t*SR);if(s0>=b.n)return;
  const len=Math.min(Math.ceil(o.tau*7*SR)+48,b.n-s0),k=1/(o.tau*SR),n=new Float32Array(len);
  for(let i=0;i<len;i++)n[i]=(Math.random()*2-1)*Math.exp(-i*k)*(i<4?(i+1)/5:1);
  const f=n.slice();runF(f,coef('bp',o.f,o.Q));const gq=Math.sqrt(o.Q)*1.5,raw=o.raw||0;
  if(raw){const h=n.slice();runF(h,coef('hp',1800,.7));for(let i=0;i<len;i++)f[i]=f[i]*gq+h[i]*raw;}
  else for(let i=0;i<len;i++)f[i]*=gq;
  mixIn(b,s0,f,o.amp,o.pan||0);
}
function ping(b,t,o){
  const s0=Math.floor(t*SR);if(s0>=b.n)return;
  const len=Math.min(Math.ceil(o.tau*8*SR),b.n-s0),a=new Float32Array(len);
  let ph=0;const gl=o.glide||0,gt=o.gt||.01,atk=SR*(o.atk||.0006);
  for(let i=0;i<len;i++){const tt=i/SR;const f=o.f*(1+gl*(1-Math.exp(-tt/gt)));ph+=TAU*f/SR;a[i]=Math.sin(ph)*Math.exp(-tt/o.tau)*Math.min(1,i/atk);}
  mixIn(b,s0,a,o.amp,o.pan||0);
}
function noise(b,t,d,o){
  const s0=Math.floor(t*SR);if(s0>=b.n)return;
  const len=Math.min(Math.ceil(d*SR),b.n-s0),a=new Float32Array(len);
  for(let i=0;i<len;i++)a[i]=Math.random()*2-1;
  if(o.filters)for(const [ty,f,Q] of o.filters)runF(a,coef(ty,f,Q));
  if(o.svf){let lo=0,bd=0;const q=1/o.svf.Q,band=o.svf.out==='band';
    for(let i=0;i<len;i++){const fc=Math.min(o.svf.f(i/SR),SR/7);const F=2*Math.sin(Math.PI*fc/SR);lo+=F*bd;const hi=a[i]-lo-q*bd;bd+=F*hi;a[i]=band?bd*q*2:lo;}}
  for(let i=0;i<len;i++)a[i]*=o.env(i/SR);
  mixIn(b,s0,a,o.amp,o.pan||0);
}
function finish(b,peak){
  const hp=coef('hp',35,.7);runF(b.L,hp);runF(b.R,hp);
  let m=1e-9;for(let i=0;i<b.n;i++){const a=Math.abs(b.L[i]),c=Math.abs(b.R[i]);if(a>m)m=a;if(c>m)m=c;}
  const g=peak/m*1.3,T=Math.tanh(1.3),fo=Math.floor(SR*.008);
  for(const ch of [b.L,b.R])for(let i=0;i<b.n;i++){let v=Math.tanh(ch[i]*g)/T;const r=b.n-i;if(r<fo)v*=r/fo;ch[i]=v;}
  return b;
}
/* パキッ: the main fracture under the fingertip */
function genSnap(bright,short){
  const b=mk(short?.2:.34);
  let t=0;const nm=1+(Math.random()*2.5|0);
  for(let k=0;k<nm;k++){if(k){t+=rnd(.0008,.006);b.hits.push(t);}
    click(b,t,{amp:k?rnd(.45,.85):1,tau:rnd(.0004,.0011),f:rnd(2600,6000)*bright,Q:rnd(.6,1.1),raw:.35,pan:rnd(-.15,.15)});}
  if(!short)click(b,rnd(0,.002),{amp:rnd(.55,.8),tau:rnd(.0012,.0025),f:rnd(900,1800),Q:rnd(.7,1.2),raw:.15,pan:rnd(-.1,.1)});
  noise(b,0,.03,{amp:short?.06:.12,env:tt=>Math.exp(-tt/.005),filters:[['bp',rnd(900,1400),.8]]});
  for(let k=0;k<3;k++)ping(b,rnd(0,.003),{f:rnd(1100,3600)*bright,tau:rnd(.003,.012),amp:rnd(.04,.1),glide:-.03,gt:.01,pan:rnd(-.3,.3)});
  const m=short?rnd(4,9):rnd(10,26),lim=short?.12:.24;t=.002;
  for(let i=0;i<m;i++){t+=expR(.004+i*.0012);if(t>lim)break;
    let a=rnd(.06,.42)*Math.exp(-t*9);if(Math.random()<.12){a*=2.2;b.hits.push(t);}
    click(b,t,{amp:a,tau:rnd(.00018,.0009),f:rnd(1800,9500)*bright,Q:rnd(1.4,5),raw:.2,pan:rnd(-.6,.6)});}
  noise(b,0,.14,{amp:.05,env:tt=>Math.exp(-tt/.03),filters:[['hp',6500,.7]]});
  return finish(b,short?.8:.95);
}
/* ザクザク: loose flakes crushed and knocked off */
function genCrunch(){
  const d=rnd(.12,.22),b=mk(d),m=rnd(14,30);let t=0;
  for(let i=0;i<m;i++){t+=expR(d/m*.7);if(t>d-.01)break;click(b,t,{amp:rnd(.15,.7),tau:rnd(.0003,.0012),f:rnd(1200,6500),Q:rnd(.8,2.5),raw:.3,pan:rnd(-.5,.5)});}
  noise(b,0,d,{amp:.06,env:tt=>Math.exp(-tt/.05),filters:[['bp',2500,.7]]});
  return finish(b,.7);
}
/* パリパリ: cracks running through the coating */
function genCrackle(){
  const d=rnd(.18,.3),b=mk(d),m=rnd(10,26);let t=rnd(0,.004);
  for(let i=0;i<m;i++){t+=expR(d/m*.8);if(t>d-.02)break;
    let a=rnd(.08,.55);if(Math.random()<.1){a*=1.8;b.hits.push(t);}
    click(b,t,{amp:a,tau:rnd(.00015,.0007),f:rnd(2800,11500),Q:rnd(1.5,6),raw:.15,pan:rnd(-.5,.5)});}
  noise(b,0,d,{amp:.03,env:tt=>Math.sin(Math.PI*Math.min(1,tt/d)),filters:[['hp',7000,.7]]});
  return finish(b,.75);
}

  ui:[12,()=>genSnap(rnd(1.2,1.5),true)], snap:[16,()=>genSnap(rnd(.9,1.12),false)], crackle:[16,genCrackle],
  crunch:[10,genCrunch]
};

const rawBank={},bank={};
const genQueue=[];
{const kinds=Object.keys(RECIPES);const max=Math.max(...kinds.map(k=>RECIPES[k][0]));
 for(let i=0;i<max;i++)for(const k of kinds)if(i<RECIPES[k][0])genQueue.push(k);}
function genStep(){
  const t0=performance.now();
  while(genQueue.length&&performance.now()-t0<10){const k=genQueue.shift();const b=RECIPES[k][1]();(rawBank[k]||(rawBank[k]=[])).push(b);if(actx)toBuf(k,b);}
  if(genQueue.length)setTimeout(genStep,0);
}

function loadNecho(){

    try{const pr=actx.decodeAudioData(u8.buffer,done,()=>{});if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}

function toBuf(k,b){const ab=actx.createBuffer(2,b.n,SR);ab.copyToChannel(b.L,0);ab.copyToChannel(b.R,1);(bank[k]||(bank[k]=[])).push({buf:ab,hits:b.hits});}
function makeIR(){
  const sr=actx.sampleRate,d=.5,n=Math.ceil(d*sr),ir=actx.createBuffer(2,n,sr);
  for(let c=0;c<2;c++){const a=ir.getChannelData(c);let lp=0;
    for(let i=0;i<n;i++){const t=i/sr,k=.6-.5*Math.min(1,t/d);lp+=(Math.random()*2-1-lp)*k;a[i]=lp*Math.exp(-t/.08)*(t<.004?t/.004:1);}}
  return ir;
}
function ensureAudio(){
  if(actx){if(actx.state!=='running')actx.resume().catch(()=>{});return;}
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{actx=new AC({latencyHint:'interactive'});}catch(e){try{actx=new AC();}catch(e2){return;}}
  const comp=actx.createDynamicsCompressor();
  comp.threshold.value=-12;comp.knee.value=8;comp.ratio.value=3;comp.attack.value=.002;comp.release.value=.12;
  master=actx.createGain();master.gain.value=.9;master.connect(comp);comp.connect(actx.destination);
  const conv=actx.createConvolver();conv.buffer=makeIR();
  wetSend=actx.createGain();wetSend.gain.value=.1;wetSend.connect(conv);conv.connect(master);
  const s=actx.createBufferSource();s.buffer=actx.createBuffer(1,1,actx.sampleRate);s.connect(actx.destination);s.start(0);
  for(const k in rawBank)for(const b of rawBank[k])toBuf(k,b);
  restoreCustom();
  loadNecho();
  if(actx.state!=='running')actx.resume().catch(()=>{});
}

/* ---------- 自分の音: user-supplied recordings, auto-sliced into single hits ---------- */
const custom={necho:null,paki:null};
const CUSTOM_OF={necho:'necho',nechoOff:'necho',snap:'paki',crackle:'paki',crunch:'paki'};
function decodeAB(ab){return new Promise((res,rej)=>{try{const p=actx.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej);}catch(e){rej(e);}});}
function sliceHits(buf,maxLen){
  const sr=buf.sampleRate,n=buf.length,ch=Math.min(2,buf.numberOfChannels),mono=new Float32Array(n);
  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)mono[i]+=d[i]/ch;}
  const hop=Math.max(1,Math.round(sr*.005)),nf=Math.floor(n/hop),env=new Float32Array(nf);let pk=0;
  for(let f=0;f<nf;f++){let s=0;for(let i=f*hop;i<(f+1)*hop;i++)s+=mono[i]*mono[i];env[f]=Math.sqrt(s/hop);if(env[f]>pk)pk=env[f];}
  if(pk<1e-5)return[];
  const floor=Float32Array.from(env).sort()[Math.floor(nf*.2)]||0,th=Math.max(pk*.1,floor*4),maxF=Math.round(maxLen*sr/hop);
  const segs=[];let quiet=99,start=-1,low=0;
  for(let f=0;f<nf;f++){
    if(start<0){if(env[f]>th&&quiet>=8){start=Math.max(0,f-1);low=0;}else quiet=env[f]>th?0:quiet+1;}
    else{low=env[f]<th*.3?low+1:0;if(low>=12||f-start>=maxF){segs.push([start,f-low+2]);start=-1;quiet=low;}}
  }
  if(start>=0)segs.push([start,Math.min(nf,start+maxF)]);
  const out=[];
  for(const [a,b] of segs){
    const s0=a*hop,s1=Math.min(n,b*hop+Math.round(sr*.03)),len=s1-s0;if(len<sr*.04)continue;
    const ab=actx.createBuffer(ch,len,sr);let m=1e-6;
    for(let c=0;c<ch;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++){const v=Math.abs(d[s0+i]);if(v>m)m=v;}}
    const gn=.8/m,fi=Math.round(sr*.003),fo=Math.round(sr*.03);
    for(let c=0;c<ch;c++){const d=buf.getChannelData(c),o=ab.getChannelData(c);
      for(let i=0;i<len;i++){let v=d[s0+i]*gn;if(i<fi)v*=i/fi;if(len-i<fo)v*=(len-i)/fo;o[i]=v;}}
    out.push({buf:ab,hits:[0]});if(out.length>=24)break;
  }
  return out;
}
const SDB={
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('paki-sounds',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});},
  async put(k,v){try{const db=await SDB.open();await new Promise((res,rej)=>{const t=db.transaction('s','readwrite'),st=t.objectStore('s');if(v==null)st.delete(k);else st.put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}},
  async get(k){try{const db=await SDB.open();return await new Promise(res=>{const r=db.transaction('s').objectStore('s').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);});}catch(e){return null;}}
};
function showCustom(msg){
  const el=document.getElementById('cstat');if(!el)return;
  el.textContent=msg||`ねちょ: ${custom.necho?'自分の音 '+custom.necho.length+'個':'収録音'} ／ パキパキ: ${custom.paki?'自分の音 '+custom.paki.length+'個':'合成音'}`;
}
async function applyCustom(kind,abs){
  const hits=[];
  for(const ab of abs){try{const buf=await decodeAB(ab.slice(0));hits.push(...sliceHits(buf,kind==='necho'?.9:.6));}catch(e){}}
  if(hits.length)custom[kind]=hits.slice(0,24);
  return hits.length;
}
let customRestored=false;
async function restoreCustom(){
  if(customRestored||!actx)return;customRestored=true;
  for(const k of ['necho','paki']){const abs=await SDB.get(k);if(abs&&abs.length)await applyCustom(k,abs);}
  showCustom();
}
const ALIAS={squish:'necho',squelch:'necho',release:'nechoOff'};
function play(kind,o={}){
  kind=ALIAS[kind]||kind;
  if(!actx||muted)return null;
  const own=CUSTOM_OF[kind]&&custom[CUSTOM_OF[kind]];const arr=own||bank[kind];if(!arr||!arr.length)return null;
  if(voices>30&&kind!=='snap'&&kind!=='ui')return null;
  const v=arr[(Math.random()*arr.length)|0];
  const src=actx.createBufferSource();src.buffer=v.buf;src.playbackRate.value=own?rnd(.96,1.04):(o.rate||1)*(kind==='necho'||kind==='nechoOff'?rnd(.82,.97):rnd(.95,1.05));
  const g=actx.createGain();g.gain.value=(o.gain??1)*LEVEL[kind];src.connect(g);let node=g;
  if(actx.createStereoPanner){const p=actx.createStereoPanner();p.pan.value=clamp(o.pan||0,-1,1)*.7;g.connect(p);node=p;}
  node.connect(master);node.connect(wetSend);voices++;src.onended=()=>{voices--;};
  src.start(actx.currentTime+(o.when||0));return v;
}

/* =========================================================
   HAPTICS: Android → Vibration API patterns timed to the
   clicks inside each sound. iPhone (iOS 18+) → the system
   switch-control tick.
   ========================================================= */
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const canVib=typeof navigator.vibrate==='function';
const hLabel=$('#hlab');
let vibeOn=canVib||isIOS,hapticBusy=0,lastIOS=0;
function haptic(pat,force){
  if(!vibeOn)return;const now=performance.now();
  if(!force&&now<hapticBusy)return;
  hapticBusy=now+pat.reduce((a,b)=>a+b,0);
  if(canVib){try{navigator.vibrate(pat);}catch(e){}return;}
  if(isIOS&&hLabel){if(now-lastIOS<30)return;lastIOS=now;hLabel.click();}
}
function patFromHits(hits,first){
  const h=[...hits].sort((a,b)=>a-b),pat=[first];let end=first;
  for(let i=1;i<h.length&&pat.length<7;i++){const ms=Math.round((h[i]-h[0])*1000),gap=ms-end;if(gap<12)continue;pat.push(gap,6);end=ms+6;}
  return pat;
}

/* =========================================================
   SIMULATION. Local units: 1u = R px.
   The stick: top face (rounded rect) + front face band.
   Coating = list of polygon shards. Presses split them along
   straight lines through the fingertip (wax breaks in straight
   facets), crush a small piece under the finger, and lift or
   drop it. Under the coating is soft yellow PU.
   ========================================================= */
const TW=1.3,TD=.45,CR=.14,FD=.3,BOT=TD+FD;
const BX0=-1.36,BY0=-.52,BW=2.72,BH=BOT+.05-BY0;
const THICK={
  thin:{minA:.0035,crush:.045,flake:.5,tips:1.25,len:1.15,rate:1.2,w:.8},
  mid:{minA:.006,crush:.055,flake:.38,tips:1,len:1,rate:1,w:1},
  thick:{minA:.011,crush:.075,flake:.3,tips:.8,len:.85,rate:.82,w:1.3}
};
let TH=THICK.mid;

function arc(cx,cy,r,a0,a1,n){const o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return o;}
function rr(x0,y0,x1,y1,r){const h=Math.PI/2;return[...arc(x1-r,y0+r,r,-h,0,6),...arc(x1-r,y1-r,r,0,h,6),...arc(x0+r,y1-r,r,h,2*h,6),...arc(x0+r,y0+r,r,2*h,3*h,6)];}
const TOP=rr(-TW,-TD,TW,TD,CR);
const SIL=rr(-TW,-TD,TW,BOT,CR);
const FRONT=(()=>{const h=Math.PI/2;const up=[...arc(TW-CR,TD-CR,CR,0,h,6),...arc(-TW+CR,TD-CR,CR,h,2*h,6)];return up.concat(up.map(([x,y])=>[x,y+FD]).reverse());})();
const toPath=pts=>{const p=new Path2D();pts.forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y));p.closePath();return p;};
const TOPP=toPath(TOP),SILP=toPath(SIL),FRONTP=toPath(FRONT);
function pip(pts,x,y){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
const onStick=(u,v)=>pip(SIL,u,v);
const onTop=(u,v)=>pip(TOP,u,v);

/* ---------- shards ---------- */
let shards=[],totalArea=1,dirty=true;
function calc(s){let a=0,cx=0,cy=0;const p=s.pts;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1];cx+=p[i][0];cy+=p[i][1];}
  s.area=Math.abs(a)/2;s.cx=cx/p.length;s.cy=cy/p.length;let r=0;for(const [x,y] of p)r=Math.max(r,Math.hypot(x-s.cx,y-s.cy));s.r=r;s.path=toPath(p);}
function mkShard(pts,face,st){const s={pts,face,st,dx:0,dy:0,rot:0,h:0};calc(s);return s;}
function clipHalf(pts,px,py,nx,ny){const out=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];
  const da=(a[0]-px)*nx+(a[1]-py)*ny,db=(b[0]-px)*nx+(b[1]-py)*ny;if(da>=0)out.push(a);
  if((da>=0)!==(db>=0)){const t=da/(da-db);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}}return out;}
function splitShard(s,px,py,ang){
  const nx=-Math.sin(ang),ny=Math.cos(ang);let pos=0,neg=0;
  for(const [x,y] of s.pts){const d=(x-px)*nx+(y-py)*ny;if(d>1e-6)pos++;else if(d<-1e-6)neg++;}
  if(!pos||!neg)return null;
  const A=clipHalf(s.pts,px,py,nx,ny),B=clipHalf(s.pts,px,py,-nx,-ny);if(A.length<3||B.length<3)return null;
  const a=mkShard(A,s.face,1),b=mkShard(B,s.face,1);
  if(a.area/(a.r*a.r)<.22||b.area/(b.r*b.r)<.22)return null;
  return[a,b];

/* ---------- soft-surface heightmap (top face) ---------- */
const HN=64,HC=2*TW/HN,HM=Math.round(2*TD/HC);

  const sc=.17*FING/HC,ci=(u+TW)/HC,cj=(v+TD)/HC,r=Math.ceil(sc*2.6),rate=Math.min(1,dt*7),i2=2*sc*sc;
  for(let j=Math.max(0,Math.floor(cj-r));j<=Math.min(HM-1,Math.ceil(cj+r));j++)
    for(let i=Math.max(0,Math.floor(ci-r));i<=Math.min(HN-1,Math.ceil(ci+r));i++){
      const dx=i+.5-ci,dy=j+.5-cj,gv=depth*Math.exp(-(dx*dx+dy*dy)/i2),k=j*HN+i;
      if(gv>Hf[k]){Hf[k]+=(gv-Hf[k])*rate;pmask[k]=1;}}
}
function relax(dt){maxH=0;const f=Math.min(1,1.1*dt);for(let k=0;k<Hf.length;k++){if(pmask[k])pmask[k]=0;else if(Hf[k]>1e-4)Hf[k]-=Hf[k]*f;else Hf[k]=0;if(Hf[k]>maxH)maxH=Hf[k];}}

  const d=shadeImg.data,Lx=-.45,Ly=-.62,Lz=.64,kk=.13/(2*HC);

    const k=j*HN+i,h=Hf[k],o=k*4;
    const hx=(Hf[j*HN+Math.min(HN-1,i+1)]-Hf[j*HN+Math.max(0,i-1)])*kk,hy=(Hf[Math.min(HM-1,j+1)*HN+i]-Hf[Math.max(0,j-1)*HN+i])*kk;

    if(light>dark){d[o]=255;d[o+1]=255;d[o+2]=240;d[o+3]=Math.min(.75,light-dark*.5)*255;}
    else{d[o]=150;d[o+1]=100;d[o+2]=10;d[o+3]=Math.min(.6,dark-light*.5)*255;}}

function fall(s){

  const sp=s.pts.map(([x,y])=>L2S(x+s.dx,y+s.dy));let mx=0,my=0;for(const [x,y] of sp){mx+=x;my+=y;}mx/=sp.length;my/=sp.length;

  parts.push({x:mx,y:my,verts:sp.map(([x,y])=>[x-mx,y-my]),vx:rnd(-90,90)+s.cx*70,vy:-rnd(40,210),rot:0,vr:rnd(-6,6),flip:0,vf:rnd(-12,12),

  pctEl.textContent=pct;barEl.style.width=pct+'%';
  const ph=pct<35?0:pct<85?1:2;
  if(phaseEl.dataset.p!==String(ph)){phaseEl.dataset.p=ph;phaseEl.textContent=['パキパキ期','パキ→ぷにぷに','ぷにぷに期'][ph];}
}
function update(dt,now){
  const soft=1-coatedArea()/totalArea;let target=0;
  for(const p of pointers.values()){
    p.pr=Math.min(1,p.pr+dt/.55);p.pin.x=p.u;
    if(p.role==='pull'){p.pin.tgt=.02;continue;}
    if(p.mode==='soft'){p.pin.tgt=.05+.09*p.pr;if(onTop(p.u,p.v))dent(p.u,p.v,.25+.75*p.pr,dt);}
    else{p.pin.tgt=.012;if(onTop(p.u,p.v))dent(p.u,p.v,.1,dt);
      if(now-p.lastHit>p.nextHit&&p.hits<7){p.hits++;p.lastHit=now;p.nextHit=rnd(170,340);crustImpact(p,.5);}}
  }
  gripAmt+=((gripHeld?1:0)-gripAmt)*Math.min(1,dt*(gripHeld?6:2.2));target+=gripAmt*.085;
  gripTick(now,dt);
  if(gripHeld)for(const s of shards.slice())if(s.st===2&&Math.random()<dt*.5)fall(s);
  const k=lerp(170,45,soft),c=lerp(20,9,soft);
  SQV+=(k*(target-SQ)-c*SQV)*dt;SQ=clamp(SQ+SQV*dt,-.06,.2);
  for(let i=pinches.length-1;i>=0;i--){const q=pinches[i];q.v+=(30*(q.tgt-q.a)-7*q.v)*dt;q.a+=q.v*dt;if(!q.live&&Math.abs(q.a)<.001&&Math.abs(q.v)<.002)pinches.splice(i,1);}
  relax(dt);stretchStep(dt,now);
  if(cracks.length){const due=cracks.filter(c=>c.t<=now);if(due.length){cracks=cracks.filter(c=>c.t>now);due.sort((a,b)=>a.t-b.t);
    for(const c of due){if(c.loosen)loosen(c);else{const n=applyCrack(c);crackAcc+=n*3;crackPan+=c.pan*n*3;}}}}
  if(crackAcc>=6&&now-lastCrackle>45){
    const v=play('crackle',{gain:clamp(crackAcc/26,.25,1),rate:TH.rate,pan:crackPan/crackAcc});
    if(v)haptic(patFromHits(v.hits,6));lastCrackle=now;crackAcc=0;crackPan=0;
  }else if(crackAcc>0&&!cracks.length&&now-lastCrackle>80){crackAcc=0;crackPan=0;}
  coatFade=Math.min(1,coatFade+dt*2.4);
  for(let i=parts.length-1;i>=0;i--){const f=parts[i];
    if(!f.landed){f.vy+=1800*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;f.flip+=f.vf*dt;
      if(f.y>=f.floor&&f.vy>0){f.y=f.floor;
        f.vy*=-rnd(.18,.34);f.vx*=.55;f.vr*=.5;f.vf*=.4;
        if(Math.abs(f.vy)<60){f.landed=true;f.vy=0;f.flip=Math.round(f.flip/Math.PI)*Math.PI;}}}
    else{f.life+=dt;if(f.life>6)f.alpha-=dt*.5;if(f.alpha<=0)parts.splice(i,1);}}
  updateMeter(now);
}
function drawComp(){
  const c=k2;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,comp.width,comp.height);c.drawImage(bodyCv,0,0);setLocal(c);
  if(maxH>.003){computeShade();c.save();c.clip(TOPP);c.imageSmoothingEnabled=true;c.drawImage(shadeCv,-TW,-TD,2*TW,HM*HC);c.restore();}
  c.globalAlpha=coatFade;
  const topF=new Path2D(),frF=new Path2D(),faint=new Path2D(),crk=new Path2D();
  for(const s of shards){if(s.st>1)continue;(s.face==='top'?topF:frF).addPath(s.path);(s.st===0?faint:crk).addPath(s.path);}
  c.fillStyle=coatTop;c.fill(topF);c.fillStyle=coatFront;c.fill(frF);
  c.lineJoin='round';
  c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=.005;c.stroke(faint);
  if(SX>1.005){c.strokeStyle='#F0CA55';c.lineWidth=(SX-1)*.055;c.stroke(crk);c.stroke(faint);}
  c.strokeStyle=`rgba(115,82,8,${(.36*(1-clamp((SX-1)*4,0,1))).toFixed(3)})`;c.lineWidth=.0065*TH.w;c.stroke(crk);
  c.save();c.translate(.0035,.0035);c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=.004;c.stroke(crk);c.restore();
  for(const s of shards){if(s.st!==2)continue;
    c.save();c.translate(s.cx+s.dx,s.cy+s.dy);c.rotate(s.rot);c.translate(-s.cx,-s.cy);
    c.save();c.translate(s.h*.5,s.h);c.fillStyle='rgba(130,90,0,.22)';c.fill(s.path);c.restore();
    c.fillStyle='rgba(255,255,255,.8)';c.fill(s.path);c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=.006;c.stroke(s.path);
    c.restore();}
  c.globalAlpha=1;
}
function draw(){
  drawComp();
  g.setTransform(DPR,0,0,DPR,0,0);
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,COL.top);bg.addColorStop(1,COL.bot);g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.save();g.translate(cx,cy+R*.75);g.scale(1,.24);
  const tg=g.createRadialGradient(0,0,R*.3,0,0,R*2.2);tg.addColorStop(0,COL.table);tg.addColorStop(1,COL.bot);g.fillStyle=tg;g.beginPath();g.arc(0,0,R*2.2,0,TAU);g.fill();g.restore();
  g.save();g.translate(cx,cy);g.rotate(ANG);g.scale(R,R);
  g.save();g.translate(AX*(1-SX),BOT+.02);g.scale((1+SQ*.4)*SX,.16);
  const sg=g.createRadialGradient(0,0,0,0,0,1.55);sg.addColorStop(0,'rgba(40,25,10,.32)');sg.addColorStop(.75,'rgba(40,25,10,.12)');sg.addColorStop(1,'rgba(40,25,10,0)');
  g.fillStyle=sg;g.beginPath();g.arc(0,0,1.55,0,TAU);g.fill();g.restore();
  const N=64,sw=comp.width/N,uw=BW/N;
  for(let i=0;i<N;i++){const sy=syAt(BX0+(i+.5)*uw),top=BOT+(BY0-BOT)*sy,sx=i*sw;
    g.drawImage(comp,sx,0,Math.min(sw+1,comp.width-sx),comp.height,AX+(BX0+i*uw-AX)*SX,top,uw*SX*1.04,BH*sy);}
  g.restore();
  for(const f of parts)if(f.landed)drawFlake(f);
  for(const f of parts)if(!f.landed)drawFlake(f);
  for(const p of pointers.values()){g.beginPath();g.arc(p.x,p.y,.075*FING*R,0,TAU);g.fillStyle='rgba(255,255,255,.16)';g.fill();
    g.lineWidth=1.5;g.strokeStyle='rgba(255,90,140,.6)';g.setLineDash(p.role==='pull'?[5,4]:[]);g.stroke();g.setLineDash([]);}
}
function flakePath(f){g.beginPath();f.verts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();}
function drawFlake(f){
  g.save();g.translate(f.x,f.y);g.rotate(f.rot);g.scale(1,Math.abs(Math.cos(f.flip))*.8+.2);g.globalAlpha=Math.max(0,f.alpha);
  g.translate(0,f.th);flakePath(f);g.fillStyle='rgba(205,190,150,.5)';g.fill();g.translate(0,-f.th);
  flakePath(f);g.fillStyle='rgba(255,255,252,.86)';g.fill();g.lineWidth=.9;g.strokeStyle='rgba(255,255,255,.98)';g.stroke();
  g.restore();
}
let lastT=performance.now();
function frame(now){const dt=Math.min(.033,(now-lastT)/1000);lastT=now;update(dt,now);draw();requestAnimationFrame(frame);}

function resize(){
  const r=stage.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ANG=W/H<.85?-.4:-.05;
  const c=Math.cos(ANG),s=Math.abs(Math.sin(ANG)),bw=BW*c+BH*s,bh=BW*s+BH*c;
  R=Math.max(30,Math.min(W*.94/bw,H*.7/bh));cx=W/2;cy=H*.45;
  const nS=R*DPR;if(Math.abs(nS-S)>.5){S=nS;comp.width=Math.ceil(BW*S);comp.height=Math.ceil(BH*S);paintBody();}
}
function resetSquishy(){
  shards=initialShards();totalArea=coatedArea();dirty=true;
  cracks=[];parts.length=0;Hf.fill(0);crackAcc=0;coatFade=0;SQV-=.6;SX=1;SXV=0;SXT=null;AX=0;
  for(const q of pinches){q.a=0;q.v=0;}
}

/* ---------- paki buttons ---------- */
const fx=$('#fx'),svgNS='http://www.w3.org/2000/svg';
function crackSVG(btn,x,y){
  const w=btn.clientWidth,h=btn.clientHeight;
  let svg=btn.querySelector('svg.cr');
  if(!svg){svg=document.createElementNS(svgNS,'svg');svg.setAttribute('class','cr');svg.setAttribute('aria-hidden','true');btn.appendChild(svg);}
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const grp=document.createElementNS(svgNS,'g'),n=3+(Math.random()*3|0),a0=rnd(0,TAU);
  for(let i=0;i<n;i++){
    let px=x,py=y,a=a0+i/n*TAU+rnd(-.4,.4);const L=rnd(.35,.8)*Math.max(w,h)*.5;let d=`M${px.toFixed(1)} ${py.toFixed(1)}`,dl=`M${(px+.8).toFixed(1)} ${(py+.8).toFixed(1)}`;
    for(let s=0;s<L;){const st=rnd(8,16);s+=st;a+=rnd(-.3,.3);px+=Math.cos(a)*st;py+=Math.sin(a)*st;d+=` L${px.toFixed(1)} ${py.toFixed(1)}`;dl+=` L${(px+.8).toFixed(1)} ${(py+.8).toFixed(1)}`;}
    for(const [cls,dd] of [['l',dl],['d',d]]){const p=document.createElementNS(svgNS,'path');p.setAttribute('d',dd);p.setAttribute('class',cls);p.setAttribute('pathLength','1');grp.appendChild(p);}
  }
  for(let i=0;i<7;i++){const c=document.createElementNS(svgNS,'circle');const a=rnd(0,TAU),r=rnd(0,6);c.setAttribute('cx',(x+Math.cos(a)*r).toFixed(1));c.setAttribute('cy',(y+Math.sin(a)*r).toFixed(1));c.setAttribute('r',rnd(.4,1.1).toFixed(2));grp.appendChild(c);}
  svg.appendChild(grp);
  while(svg.childNodes.length>4)svg.firstChild.remove();
  setTimeout(()=>grp.classList.add('fade'),650);setTimeout(()=>grp.remove(),1400);
}
function domFlakes(x,y,n){
  if(reduceMotion)n=Math.min(n,2);
  for(let i=0;i<n;i++){
    const d=document.createElement('i'),s=rnd(5,12),k=3+(Math.random()*2|0),pts=[];
    for(let q=0;q<k;q++){const a=q/k*TAU+rnd(-.4,.4),r=rnd(35,50);pts.push(`${(50+Math.cos(a)*r).toFixed(0)}% ${(50+Math.sin(a)*r).toFixed(0)}%`);}
    d.style.cssText=`left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${(s*rnd(.6,1)).toFixed(1)}px;clip-path:polygon(${pts.join(',')})`;
    fx.appendChild(d);
    const vx=rnd(-130,130),vy=rnd(-280,-90),gr=1300,T=rnd(.55,.85),rr2=rnd(-540,540),kf=[];
    for(let q=0;q<=8;q++){const t=q/8*T;kf.push({transform:`translate(${(vx*t).toFixed(1)}px,${(vy*t+.5*gr*t*t).toFixed(1)}px) rotate(${(rr2*t).toFixed(0)}deg)`,opacity:q<6?1:1-(q-5)/3});}
    const an=d.animate(kf,{duration:T*1000,easing:'linear'});an.onfinish=()=>d.remove();
  }
}
function pakiFx(btn,e){
  const r=btn.getBoundingClientRect();
  const x=e&&e.clientX?e.clientX-r.left:r.width*rnd(.35,.65),y=e&&e.clientY?e.clientY-r.top:r.height*rnd(.35,.65);
  crackSVG(btn,x,y);domFlakes(r.left+x,r.top+y,4+(Math.random()*4|0));
  const v=play('ui',{gain:1,rate:rnd(1.05,1.25),pan:clamp(((r.left+x)/window.innerWidth)*2-1,-1,1)*.6});
  haptic(v?patFromHits(v.hits,12):[12,30,6],true);
}
document.querySelectorAll('.paki').forEach(btn=>{
  btn.addEventListener('pointerdown',e=>{if(btn.disabled)return;ensureAudio();btn.classList.add('down');pakiFx(btn,e);});
  const up=()=>btn.classList.remove('down');
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,up));
  btn.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){ensureAudio();btn.classList.add('down');pakiFx(btn,null);setTimeout(up,120);}});
});

const startEl=$('#start');
function hideStart(){if(startEl.classList.contains('gone'))return;startEl.classList.add('gone');if(!started)hintEl.classList.remove('hide');}
$('#go').addEventListener('click',()=>{ensureAudio();hideStart();});
$('#reset').addEventListener('click',()=>{resetSquishy();});
for(const [id,kind] of [['fNecho','necho'],['fPaki','paki']]){
  const inp=document.getElementById(id),lab=document.querySelector(`label[for="${id}"]`);
  lab.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click();}});
  inp.addEventListener('change',async()=>{
    const files=[...inp.files];inp.value='';if(!files.length)return;
    ensureAudio();if(!actx){showCustom('このブラウザでは音を読み込めません');return;}
    showCustom('読み込み中…');
    const abs=await Promise.all(files.map(f=>f.arrayBuffer()));
    const n=await applyCustom(kind,abs);
    if(n){SDB.put(kind,abs);showCustom();play(kind==='necho'?'necho':'snap',{gain:1});}
    else showCustom('音を読み込めませんでした。mp3・m4a・wav のファイルを選んでください');
  });
}
$('#fReset').addEventListener('click',()=>{custom.necho=custom.paki=null;SDB.put('necho',null);SDB.put('paki',null);showCustom();});
document.querySelectorAll('[data-th]').forEach(b=>b.addEventListener('click',()=>{
  TH=THICK[b.dataset.th];
  document.querySelectorAll('[data-th]').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));
  resetSquishy();
}));
const fingEl=$('#finger'),fingV=$('#fingv'),FNAMES={.5:'こども',.75:'細め',1:'ふつう',1.25:'太め',1.5:'太い',1.75:'かなり太い',2:'親指'};
function setFing(v,sound){FING=v;fingV.textContent=FNAMES[v]||v;fingEl.style.setProperty('--fill',((v-.5)/1.5*100).toFixed(0)+'%');fingEl.style.setProperty('--th',(14+v*8)+'px');
  if(sound){play('ui',{gain:.25+.15*v,rate:1.55-v*.35});haptic([Math.round(4+v*4)],true);}}
fingEl.addEventListener('input',()=>{ensureAudio();setFing(+fingEl.value,true);});
setFing(+fingEl.value,false);
let hintT=0;
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
  MODE=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));
  hintEl.textContent=MODE==='pull'?'バターをつかんで横に引っぱる。2本指でも引っぱれます':'押す・なぞる・長押しでパキパキ。2本指で引っぱる';
  hintEl.classList.remove('hide');clearTimeout(hintT);hintT=setTimeout(()=>hintEl.classList.add('hide'),2800);
}));
const gripBtn=$('#grip');
function gripOn(){gripHeld=true;nextGrip=performance.now()+40;hideStart();firstTouch();}
function gripOff(){if(!gripHeld)return;gripHeld=false;play('release',{gain:.85});haptic([4,60,3,90,2],true);}
gripBtn.addEventListener('pointerdown',e=>{try{gripBtn.setPointerCapture(e.pointerId);}catch(err){}gripOn();});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>gripBtn.addEventListener(ev,gripOff));
gripBtn.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){gripOn();setTimeout(gripOff,700);}});
gripBtn.addEventListener('contextmenu',e=>e.preventDefault());
$('#snd').addEventListener('click',e=>{
  muted=!muted;const b=e.currentTarget;b.setAttribute('aria-pressed',String(!muted));$('#sndv').textContent=muted?'OFF':'ON';
  if(master&&actx)master.gain.setTargetAtTime(muted?0:.9,actx.currentTime,.02);
});
const vibBtn=$('#vib');
if(!canVib&&!isIOS){vibBtn.disabled=true;vibBtn.setAttribute('aria-pressed','false');$('#vibv').textContent='非対応';}
vibBtn.addEventListener('click',()=>{vibeOn=!vibeOn;vibBtn.setAttribute('aria-pressed',String(vibeOn));$('#vibv').textContent=vibeOn?'ON':'OFF';if(vibeOn)haptic([20],true);});

/* ---------- boot ---------- */
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',readTheme);
new MutationObserver(readTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
resize();
resetSquishy();coatFade=1;SQV=0;
new ResizeObserver(resize).observe(stage);
if(document.fonts){document.fonts.load('400 40px "Dela Gothic One"').then(paintBody).catch(()=>{});document.fonts.ready.then(paintBody);}
genStep();
requestAnimationFrame(frame);
})();
</script>
